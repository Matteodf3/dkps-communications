<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1e21" />
    <meta name="description" content="DKPS Communications designs professional Push-to-Talk systems connecting radios, cellular connectivity, a PTT platform and dispatch around your operation." />
    <title>DKPS Communications | Professional communication systems</title>
  </head>
  <body>
    <!-- Netlify detects React forms from static HTML at build time. Keep field names in sync with OperationalBrief. -->
    <form name="dkps-operational-brief" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="sector" />
      <input name="scope" />
      <input name="communication" />
      <input name="context" />
      <input name="language" />
      <input name="name" />
      <input name="company" />
      <input name="email" />
      <input name="phone" />
      <input name="privacy-consent" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
